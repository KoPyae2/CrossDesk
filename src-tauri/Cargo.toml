[package]
name = "cross-desk"
version = "0.1.0"
description = "CrossDesk - share one keyboard, mouse and clipboard across every device on your LAN"
authors = ["CrossDesk"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cross_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# async runtime: only the pieces we actually use, to keep the binary small
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }

# wire format: postcard is a compact non-self-describing binary format,
# far smaller than JSON per input event and cheap to encode
postcard = { version = "1.1", features = ["use-std"] }

# pairing + transport security
x25519-dalek = { version = "3.0", features = ["getrandom"] }
chacha20poly1305 = "0.11"
blake3 = "1.8"
getrandom = "0.4"

arboard = "3.6"
display-info = "0.5"
if-addrs = "0.15"
parking_lot = "0.12"
thiserror = "2.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

# Non-Windows platforms use enigo for input injection (client role).
[target.'cfg(not(windows))'.dependencies]
enigo = "0.6"

[profile.release]
# input latency benefits far more from optimisation than from build speed
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
